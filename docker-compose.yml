services:
  web:
    build: .
    command: sh -c "npm run prisma:generate && npm run prisma:migrate:deploy && npm --workspace apps/web run start"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/scaner.db}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      INSTAGRAM_SESSION_FILE: ${INSTAGRAM_SESSION_FILE:-.instagram/session.json}
      INSTAGRAM_PROXY_URL: ${INSTAGRAM_PROXY_URL:-}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN:-}
      VK_SERVER_TOKEN: ${VK_SERVER_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ScanerBlogers}
    ports:
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - sqlite-data:/app/data

  worker:
    build: .
    command: sh -c "npm run prisma:generate && npm run prisma:migrate:deploy && npm --workspace apps/worker run start"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/scaner.db}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      INSTAGRAM_SESSION_FILE: ${INSTAGRAM_SESSION_FILE:-.instagram/session.json}
      INSTAGRAM_PROXY_URL: ${INSTAGRAM_PROXY_URL:-}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN:-}
      VK_SERVER_TOKEN: ${VK_SERVER_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-15000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SOCIAL_KNOWN_PROFILE_SKIP_LIMIT: ${SOCIAL_KNOWN_PROFILE_SKIP_LIMIT:-5000}
      SOCIAL_PLATFORM_CONCURRENCY_INSTAGRAM: ${SOCIAL_PLATFORM_CONCURRENCY_INSTAGRAM:-1}
      SOCIAL_PLATFORM_CONCURRENCY_VK: ${SOCIAL_PLATFORM_CONCURRENCY_VK:-1}
      SOCIAL_PLATFORM_CONCURRENCY_YOUTUBE: ${SOCIAL_PLATFORM_CONCURRENCY_YOUTUBE:-1}
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
